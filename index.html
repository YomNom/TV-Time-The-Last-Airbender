<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Avatar: The Last Airbender Script Analysis</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:;base64,iVBORwOKGO=">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <!-- Season Filter -->
    <div id="season-filter">
        <p><strong>SEASON FILTER</strong></p>
        <div class="season-select">
            <button id="all-season" type="button" onclick="selectAllSeasons()">Show All</button>
            <label class="season-toggle">
                <input type="checkbox" name="season-select" value="1" checked>
                <span>Season 1</span>
            </label>
            <label class="season-toggle">
                <input type="checkbox" name="season-select" value="2" checked>
                <span>Season 2</span>
            </label>
            <label class="season-toggle">
                <input type="checkbox" name="season-select" value="3" checked>
                <span>Season 3</span>
            </label>
        </div>
    </div>

    <section id="season-stats">
        <p><strong>SEASON STATS</strong></p>
        <div id="season-stats-content"></div>
    </section>

    <section id="phrase-explorer">
        <p><strong>PHRASE LIFECYCLE EXPLORER</strong></p>
        <div id="phrase-examples"></div>
        <div class="phrase-search-bar">
            <input type="text" id="phrase-input" placeholder="Search a word or phrase…" />
            <button id="phrase-search-btn">Search</button>
        </div>
        <label class="phrase-toggle-row">
            <input type="checkbox" id="phrase-stem-toggle" />
            <span class="phrase-toggle-label">Match related word forms</span>
            <span class="phrase-toggle-hint">(e.g. "fight" → fighting, fighter)</span>
        </label>
        <div id="phrase-summary" class="phrase-summary"></div>
        <div class="phrase-charts">
            <div id="phrase-timeline"></div>
            <div id="phrase-characters"></div>
        </div>
    </section>

    <script src="js/d3.v6.min.js"></script>
    <script src="js/phrase-lifecycle-explorer.js"></script>
    <script src="js/main.js"></script>

    <div id="tooltip"></div>

</body>
</html>
